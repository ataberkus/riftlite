[package]
name = "riftlite"
version = "0.1.0"
edition = "2024"
description = "Lightweight League of Legends / TFT desktop companion"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
# Already in eframe's tree (png); jpeg adds Data Dragon splash art and the header banner.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = { version = "0.18", features = ["verify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Wdk_System_Threading", "Win32_System_Kernel", "Win32_Security", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Accessibility"] }
# WinRT: Windows' built-in OCR reads the ARAM Mayhem augment card titles.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[build-dependencies]
# Windows resources: the .exe icon and version info (build-time only).
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
